name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste WireGuard configs, private keys or your real IP address here.
        A leak or anything security-related goes to private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: status
    attributes:
      label: Output of `vpn-status` and `vpn-verify`
      description: Replace IP addresses with x.x.x.x before pasting.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of: cat /usr/local/lib/vpnkit/VERSION; omarchy version"
