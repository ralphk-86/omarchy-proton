name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tools the scripts expect (Arch has them; Ubuntu defaults to mawk)
        run: sudo apt-get install -y --no-install-recommends uuid-runtime gawk
      - name: Static checks
        run: tests/check.sh
